name: Build and push foodios-social-card
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'bskyogcard/**'
  #     - 'Dockerfile.bskyogcard'
  #     - '.github/workflows/build-and-push-ogcard-aws.yaml'

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
  IMAGE_NAME: foodios-social-card

jobs:
  build-and-push-ogcard:
    if: github.repository == 'inconceivableza/social-app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v1

      - name: Log into dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: ./Dockerfile.bskyogcard
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOCIAL_APP_NAME=${{ vars.SOCIAL_APP_NAME }}