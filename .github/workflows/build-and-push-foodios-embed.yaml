name: Build and push foodios-social-embed
on:
  workflow_dispatch:

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
  IMAGE_NAME: foodios-social-embed

jobs:
  build:
    if: github.repository == 'inconceivableza/social-app'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare platform tag
        id: platform
        run: |
          platform=${{ matrix.platform }}
          echo "tag=${platform//\//-}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=-${{ steps.platform.outputs.tag }},format=long

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          file: ./Dockerfile.embedr
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.platform.outputs.tag }}
            type=registry,ref=${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:buildcache-${{ steps.platform.outputs.tag }},mode=max
    outputs:
      digest-amd64: ${{ matrix.platform == 'linux/amd64' && steps.build-and-push.outputs.digest || '' }}
      digest-arm64: ${{ matrix.platform == 'linux/arm64' && steps.build-and-push.outputs.digest || '' }}

  create-manifest:
    if: github.repository == 'inconceivableza/social-app' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=,suffix=,format=long
            type=raw,value=latest

      - name: Create and push multi-platform manifest
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)

          # Create manifest with commit hash tag
          docker buildx imagetools create -t ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:${COMMIT_HASH} \
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:${COMMIT_HASH}-linux-amd64 \
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:${COMMIT_HASH}-linux-arm64

          # Create manifest with latest tag
          docker buildx imagetools create -t ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:latest-linux-amd64 \
            ${{ env.DOCKERHUB_REPO }}/${{ env.IMAGE_NAME }}:latest-linux-arm64

          echo "Created multi-platform manifests: ${COMMIT_HASH} and latest"
