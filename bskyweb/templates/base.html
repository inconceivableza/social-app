<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  {% for domain in preconnectDomains -%}
  <link rel="preconnect" href="{{ domain }}">
  {% endfor %}
  <title>{%- block head_title -%}{{ socialappName }}{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  <link rel="preload" as="font" type="font/woff2" href="{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    @font-face {
      font-family: 'InterVariable';
      src: url("{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'InterVariableItalic';
      src: url("{{ staticCDNHost }}/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: italic;
      font-display: swap;
    }
    html {
      background-color: white;
    }
    @media (prefers-color-scheme: dark) {
      html {
        background-color: black;
      }
    }
    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }
    #splash {
      position: fixed;
      width: 100px;
      left: 50%;
      top: 50%;
      transform: translateX(-50%) translateY(-50%) translateY(-50px);
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#1185fe">
  <meta name="theme-color">
  <meta name="application-name" content="{{ socialappName }}">
  <meta name="generator" content="bskyweb">
  <meta property="og:site_name" content="{{ socialappName }} Social">
  <meta property="og:logo" content="{{ favicon }}">
  <meta name="twitter:site" content="@bluesky" />
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>
{%- block body_all %}
  <div id="root">
    <div id="splash">
      <!-- Bluesky SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" version="1.1" id="svg56" xml:space="preserve"><defs id="defs8"><clipPath clipPathUnits="userSpaceOnUse" id="clipPath1"><rect style="opacity:0.5;fill:#b0b0b0;stroke-width:1.79104" id="rect2" viewBox="0 0 512 512" x="1964.0001" y="918.18048" /></clipPath></defs><g id="layer1" transform="translate(-1144,-1514.3454)"><path id="logo" style="display:inline;fill:#e88627;fill-opacity:1;stroke:none;stroke-width:30.575;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1" d="M 1326.6174,1551.392 C 1324.2383,1547.7852 1321.2779,1543.4154 1320.8282,1539.0292 1320.5217,1536.0416 1321.636,1533.2269 1323.5295,1530.947 1333.0091,1519.5354 1357.7835,1515.6682 1372.1827,1514.6078 1376.0346,1514.1811 1380.2428,1514.3784 1384.1178,1514.484 1398.2991,1514.8706 1419.6828,1518.6826 1429.7213,1529.441 1432.3303,1532.2369 1434.6729,1535.9475 1434.4126,1539.913 1434.0855,1544.9043 1430.3039,1548.5372 1426.801,1551.6451 L 1457.2979,1563.422 C 1486.0583,1573.382 1501.2426,1579.1994 1534.2256,1596.4185 1558.6271,1613.147 1583.9993,1626.3215 1608.3193,1642.5027 1627.1473,1663.7463 1601.8814,1686.8431 1585.4537,1699.513 1603.8475,1732.2179 1614.3576,1770.2471 1609.9886,1807.8956 1603.3718,1880.415 1551.1452,1940.4426 1490.2077,1975.8094 1437.9618,1999.2442 1323.4812,1999.8131 1268.7921,1975.8094 1207.8545,1940.4426 1155.6286,1880.415 1149.0111,1807.8956 1144.6428,1770.2471 1155.1523,1732.2179 1173.546,1699.513 1157.1183,1686.8431 1131.8524,1663.7463 1150.6809,1642.5027 1174.9998,1626.3215 1200.3733,1613.147 1224.7741,1596.4185 1257.7569,1579.1994 1272.9415,1573.382 1301.7009,1563.422 Z" /></g></svg>
    </div>
  </div>

  <noscript>
    <h1 lang="en">JavaScript Required</h1>
    <p lang="en">This is a heavily interactive web application, and JavaScript is required. Simple HTML interfaces are possible, but that is not what this is.
    <p lang="en">Learn more about {{ socialappName }} at <a href="{{ socialappAbout }}">{{ socialappAboutHost }}</a> and <a href="https://atproto.com">atproto.com</a>.
    {% block noscript_extra %}{% endblock %}
  </noscript>
{% endblock -%}
</body>
</html>
