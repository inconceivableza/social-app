<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <link rel="preconnect" href="https://pds.mysky.local.social">
  <title>{%- block head_title -%}Opensky{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  <link rel="preload" as="font" type="font/woff2" href="{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `foodiosweb/templates/base.html`
     */
    @font-face {
      font-family: 'InterVariable';
      src: url("{{ staticCDNHost }}/static/media/InterVariable.c504db5c06caaf7cdfba.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'InterVariableItalic';
      src: url("{{ staticCDNHost }}/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2") format('woff2');
      font-weight: 300 1000;
      font-style: italic;
      font-display: swap;
    }
    html {
      background-color: white;
    }
    @media (prefers-color-scheme: dark) {
      html {
        background-color: black;
      }
    }
    html,
    body {
      margin: 0px;
      padding: 0px;
      font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }
    #splash {
      position: fixed;
      width: 100px;
      left: 50%;
      top: 50%;
      transform: translateX(-50%) translateY(-50%) translateY(-50px);
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#1185fe">
  <meta name="theme-color">
  <meta name="application-name" content="Opensky">
  <meta name="generator" content="foodiosweb">
  <meta property="og:site_name" content="Opensky Social" />
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>
{%- block body_all %}
  <div id="root">
    <div id="splash">
      <!-- Opensky SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" version="1.1" id="svg56" xml:space="preserve"><g id="layer1" transform="translate(-1144,-1514.3454)"><path id="logo" style="display:inline;fill:#e88627;fill-opacity:1;stroke:none;stroke-width:30.575;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1" d="m 1326.6174,1551.392 c -2.3791,-3.6068 -5.3395,-7.9766 -5.7892,-12.3628 -0.3065,-2.9876 0.8078,-5.8023 2.7013,-8.0822 9.4796,-11.4116 34.254,-15.2788 48.6532,-16.3392 3.8519,-0.4267 8.0601,-0.2294 11.9351,-0.1238 14.1813,0.3866 35.565,4.1986 45.6035,14.957 2.609,2.7959 4.9516,6.5065 4.6913,10.472 -0.3271,4.9913 -4.1087,8.6242 -7.6116,11.7321 l 30.4969,11.7769 c 28.7604,9.96 43.9447,15.7774 76.9277,32.9965 24.4015,16.7285 49.7737,29.903 74.0937,46.0842 18.828,21.2436 -6.4379,44.3404 -22.8656,57.0103 18.3938,32.7049 28.9039,70.7341 24.5349,108.3826 -6.6168,72.5194 -58.8434,132.547 -119.7809,167.9138 -52.2459,23.4348 -166.7265,24.0037 -221.4156,0 -60.9376,-35.3668 -113.1635,-95.3944 -119.781,-167.9138 -4.3683,-37.6485 6.1412,-75.6777 24.5349,-108.3826 -16.4277,-12.6699 -41.6936,-35.7667 -22.8651,-57.0103 24.3189,-16.1812 49.6924,-29.3557 74.0932,-46.0842 32.9828,-17.2191 48.1674,-23.0365 76.9268,-32.9965 z" /></g></svg>
    </div>
  </div>

  <noscript>
    <h1 lang="en">JavaScript Required</h1>
    <p lang="en">This is a heavily interactive web application, and JavaScript is required. Simple HTML interfaces are possible, but that is not what this is.
    <p lang="en">Learn more about Opensky at <a href="https://pds.mysky.local.social">pds.mysky.local.social</a> and <a href="https://atproto.com">atproto.com</a>.
    {% block noscript_extra %}{% endblock %}
  </noscript>
{% endblock -%}
</body>
</html>
